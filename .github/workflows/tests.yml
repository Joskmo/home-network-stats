name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --require-hashes -r dashboard/requirements.txt
      - run: python -m unittest discover -v
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/topology-ui-qa.py
      - run: python tests/topology-integration-qa.py
      - run: python tests/topology-regressions-qa.py
      - run: python tests/topology-ports-qa.py
      - run: python tests/topology-route-errors-qa.py
      - run: python tests/topology-large-map-qa.py
      - run: python tests/topology-routing-v2-qa.py
      - run: python tests/topology-editor-v2-qa.py
