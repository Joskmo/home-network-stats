name: home-network-dashboard
services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: ["/tmp:size=8m,mode=1777"]
    environment:
      DASHBOARD_BIND: 0.0.0.0
      DASHBOARD_PORT: "18080"
      DASHBOARD_AUTH_FILE: /auth/state.json
      DASHBOARD_BOOTSTRAP_FILE: /auth/bootstrap
      DASHBOARD_HISTORY_FILE: /history/traffic.sqlite3
      DASHBOARD_SPEED_FILE: /speed/wan.json
      DASHBOARD_TOPOLOGY_DIR: /topology
      DASHBOARD_INVENTORY_FILE: /inventory/devices.json
      DASHBOARD_PUBLIC_ENABLED: ${DASHBOARD_PUBLIC_ENABLED:-false}
      DASHBOARD_PUBLIC_HOST: home-lan.jos-dev.ru
      DASHBOARD_TRUSTED_LAN_PROXY: ${DASHBOARD_TRUSTED_LAN_PROXY:-}
      DASHBOARD_LAN_NETWORK: ${DASHBOARD_LAN_NETWORK:-192.168.1.0/24}
    volumes:
      - type: bind
        source: ${DASHBOARD_AUTH_DIR:-/srv/self-hosted-music/home-network-dashboard/auth}
        target: /auth
        bind: {create_host_path: false}
      - type: bind
        source: ${DASHBOARD_HISTORY_DIR:-/srv/self-hosted-music/traffic-telegram-bot/data}
        target: /history
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DASHBOARD_SPEED_DIR:-/srv/self-hosted-music/home-network-dashboard/speed}
        target: /speed
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DASHBOARD_TOPOLOGY_DIR:-/srv/self-hosted-music/home-network-dashboard/topology}
        target: /topology
        bind: {create_host_path: false}
      - type: bind
        source: ${DASHBOARD_INVENTORY_DIR:-/srv/self-hosted-music/home-network-dashboard/inventory}
        target: /inventory
        read_only: true
        bind: {create_host_path: false}
    # No host-published ports. Host sampler owns SSH key; never mount it here.
    networks: [web]
    labels:
      traefik.enable: ${DASHBOARD_PUBLIC_ENABLED:-false}
      traefik.docker.network: web
      traefik.http.routers.home-network.rule: Host(`home-lan.jos-dev.ru`)
      traefik.http.routers.home-network.entrypoints: websecure
      traefik.http.routers.home-network.tls: "true"
      traefik.http.routers.home-network.tls.certresolver: letsencrypt
      traefik.http.services.home-network.loadbalancer.server.port: "18080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:18080/api/session',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  web:
    external: true
